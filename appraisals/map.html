<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f8f6; display: flex; flex-direction: column; height: 100vh; }
#header { padding: 12px 16px 8px; flex-shrink: 0; }
h1 { font-size: 15px; font-weight: 500; color: #0b0b0b; }
.sub { font-size: 11px; color: #52514e; margin-top: 2px; }
#legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 7px 16px 9px; border-bottom: 1px solid #e1e0d9; border-top: 1px solid #e1e0d9; flex-shrink: 0; background: #fff; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #0b0b0b; }
.dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 0 0 1px rgba(0,0,0,0.25); flex-shrink: 0; }
#status { padding: 5px 16px; font-size: 10.5px; color: #52514e; background: #f1efe8; border-bottom: 1px solid #e1e0d9; flex-shrink: 0; }
#map { flex: 1; }
.leaflet-popup-content { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; line-height: 1.6; }
.leaflet-popup-content strong { font-size: 13px; }
.leaflet-popup-content .tag { display: inline-block; font-size: 10px; border-radius: 3px; padding: 1px 5px; margin-top: 3px; }
.leaflet-popup-content .price { font-size: 15px; font-weight: 600; color: #0b0b0b; }
.leaflet-popup-content .asr { color: #52514e; font-size: 11px; }
.leaflet-popup-content table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 11px; }
.leaflet-popup-content td { padding: 2px 6px 2px 0; }
.leaflet-popup-content td:last-child { text-align: right; color: #52514e; }
</style>
</head>

      </table>`

const map = L.map('map').setView([38.935, -77.178], 14);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);

function createIcon(color, isSubject) {
  const size = isSubject ? 22 : 15;
  const ring = isSubject ? `<circle cx="11" cy="11" r="4.5" fill="white"/>` : '';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 22 22">
    <circle cx="11" cy="11" r="10" fill="${color}" stroke="white" stroke-width="2.5"/>
    ${ring}
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    popupAnchor: [0, -(size/2 + 4)]
  });
}

const statusEl = document.getElementById('status');
let loaded = 0;
let failed = 0;
const bounds = [];

async function geocodeAndAdd(prop, delay) {
  await new Promise(r => setTimeout(r, delay));
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(prop.address)}&limit=1&countrycodes=us`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data && data[0]) {
      const lat = parseFloat(data[0].lat);
      const lon = parseFloat(data[0].lon);
      bounds.push([lat, lon]);
      const marker = L.marker([lat, lon], {
        icon: createIcon(prop.color, prop.type === 'subject'),
        zIndexOffset: prop.type === 'subject' ? 1000 : 0
      });
      marker.bindPopup(prop.popup, { maxWidth: 260, minWidth: 220 });
      marker.addTo(map);
      loaded++;
    } else {
      loaded++;
      failed++;
    }
    statusEl.textContent = loaded < properties.length
      ? `Geocoding… ${loaded} of ${properties.length}`
      : failed > 0
        ? `${properties.length - failed} of ${properties.length} properties mapped. ${failed} could not be geocoded.`
        : `All ${properties.length} properties mapped. Click any pin for details.`;
    if (loaded === properties.length && bounds.length > 1) {
      map.fitBounds(bounds, { padding: [40, 40] });
    }
  } catch(e) {
    loaded++;
    failed++;
  }
}

properties.forEach((prop, i) => geocodeAndAdd(prop, i * 1200));
</script>
