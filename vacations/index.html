<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacations — Ghazal Tehrani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a2e;
    --ink-soft: #3d3d5c;
    --gold: #b8922a;
    --gold-text: #8a6a1a;
    --cream: #faf8f4;
    --warm-white: #ffffff;
    --mist: #f0ede8;
    --rule: #e2ddd6;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }

  html { scroll-behavior: smooth; }
  body { font-family: var(--sans); background: var(--cream); color: var(--ink); overflow-x: hidden; }

  a:focus-visible, .trip-card:focus-visible {
    outline: 2px solid var(--gold-text);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 48px;
    background: rgba(250,248,244,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
  }
  .nav-logo {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-decoration: none;
  }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--gold-text); }

  /* HERO */
  .hero {
    padding: 140px 48px 56px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 300;
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: 16px;
  }
  .hero-sub {
    font-size: 0.95rem;
    color: var(--ink-soft);
    max-width: 560px;
    line-height: 1.7;
  }

  /* TRIP GRID */
  .trip-grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 48px 96px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }
  .trip-card {
    display: block;
    text-decoration: none;
    color: var(--ink);
    background: var(--warm-white);
    border: 1px solid var(--rule);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .trip-card:hover {
    border-color: var(--gold-text);
    box-shadow: 0 8px 28px rgba(184,146,42,0.14);
    transform: translateY(-2px);
  }
  .trip-thumb {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
    background: var(--mist);
  }
  .trip-body { padding: 18px 20px 20px; }
  .trip-title {
    font-family: var(--serif);
    font-size: 1.2rem;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .trip-dates {
    font-size: 0.78rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }

  /* EMPTY / COMING SOON CARD */
  .trip-card.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    border-style: dashed;
    color: var(--ink-soft);
    font-size: 0.82rem;
    cursor: default;
  }
  .trip-card.placeholder:hover {
    border-color: var(--rule);
    box-shadow: none;
    transform: none;
  }

  footer {
    text-align: center;
    padding: 40px 48px;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }
  footer a { color: var(--gold-text); text-decoration: none; }

  @media (max-width: 640px) {
    nav { padding: 16px 20px; }
    .hero, .trip-grid { padding-left: 20px; padding-right: 20px; }
    .hero { padding-top: 110px; }
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="https://ghazal-tehrani.me/main">Home</a>
  <div class="nav-links">
    <a href="https://ghazal-tehrani.me/main#personal">Back to Personal</a>
  </div>
</nav>

<div class="hero">
  <h1>Vacations</h1>
  <p class="hero-sub">A running album of family trips — click a trip to open the full page.</p>
</div>

<div class="trip-grid">
  <a class="trip-card" href="https://ghazal-tehrani.me/vacations/costarica2026" target="_blank">
    <img class="trip-thumb" src="costarica2026/waterfall.jpg" alt="Waterfall in the Costa Rica cloud forest">
    <div class="trip-body">
      <div class="trip-title">Costa Rica Family Trip</div>
      <div class="trip-dates">August 7–16, 2026</div>
    </div>
  </a>

  <div class="trip-card placeholder" aria-hidden="true">
    More trips coming soon
  </div>
</div>

<footer>
  <a href="https://ghazal-tehrani.me">ghazal-tehrani.me</a>
</footer>

</body>
</html>
