<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Christmas Gifts 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1f2420;
    --ink-soft: #4a524c;
    --pine: #1f4d3a;
    --pine-soft: #e6efe9;
    --berry: #9e2a2b;
    --berry-soft: #f6e4e2;
    --gold: #8a6a1a;
    --gold-soft: #f4ecd9;
    --cream: #faf8f4;
    --card: #ffffff;
    --rule: #e2ddd6;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }
  html { font-size: 17px; }
  body { font-family: var(--sans); background: var(--cream); color: var(--ink); line-height: 1.5; }

  nav {
    position: sticky; top: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 40px; background: rgba(250,248,244,0.95);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule);
  }
  nav a { font-family: var(--serif); font-weight: 600; font-size: 1.1rem; color: var(--ink); text-decoration: none; }
  nav a:hover { color: var(--berry); }
  nav .updated { font-size: 0.75rem; color: var(--ink-soft); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 40px; }

  header.hero { padding: 44px 0 24px; }
  .hero h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.05; }
  .hero h1 em { color: var(--berry); font-style: italic; }
  .hero p { color: var(--ink-soft); margin-top: 6px; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0 8px; }
  .stat { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
  .stat .num { font-family: var(--serif); font-size: 2rem; font-weight: 600; line-height: 1; }
  .stat .lbl { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); margin-top: 6px; }
  .stat.red .num { color: var(--berry); }
  .stat.green .num { color: var(--pine); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.78rem; color: var(--ink-soft); margin: 14px 0 28px; }

  h2.section { font-family: var(--serif); font-weight: 500; font-size: 1.7rem; margin: 8px 0 14px; }

  .kids { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 36px; }
  .kid { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
  .kid-head { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 22px 14px; border-bottom: 1px solid var(--rule); }
  .kid:nth-child(1) .kid-head { border-top: 4px solid var(--berry); }
  .kid:nth-child(2) .kid-head { border-top: 4px solid var(--pine); }
  .kid-head h3 { font-family: var(--serif); font-size: 1.8rem; font-weight: 600; }
  .kid-head .count { font-size: 0.8rem; color: var(--ink-soft); }
  .bar { height: 5px; background: var(--rule); border-radius: 3px; margin-top: 6px; width: 120px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--pine); }

  .group { padding: 14px 22px 18px; }
  .group + .group { border-top: 1px dashed var(--rule); }
  .group h4 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }

  ul.items { list-style: none; }
  ul.items li { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f0ede8; }
  ul.items li:last-child { border-bottom: none; }
  .item-name { font-weight: 500; }
  .item-meta { font-size: 0.78rem; color: var(--ink-soft); }
  .empty { font-size: 0.88rem; color: var(--ink-soft); font-style: italic; padding: 6px 0; }

  .pill { flex-shrink: 0; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.03em; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.idea { background: var(--gold-soft); color: var(--gold); }
  .pill.ordered { background: #e5ecf5; color: #2c4f7c; }
  .pill.arrived { background: var(--pine-soft); color: var(--pine); }
  .pill.wrapped { background: var(--pine); color: #fff; }
  .pill.todo { background: var(--berry-soft); color: var(--berry); }

  .others { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 48px; }
  .person { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .person.todo { border-style: dashed; }
  .person-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .person h3 { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; }
  .person .gift { font-weight: 500; }
  .person .gift.none { color: var(--ink-soft); font-style: italic; font-weight: 400; }

  footer { text-align: center; padding: 24px 0 40px; font-size: 0.75rem; color: var(--ink-soft); }
  footer a { color: var(--berry); text-decoration: none; }

  @media (max-width: 820px) {
    .kids { grid-template-columns: 1fr; }
    .others { grid-template-columns: 1fr 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 520px) {
    .wrap, nav { padding-left: 16px; padding-right: 16px; }
    .others { grid-template-columns: 1fr; }
  }
  @media print {
    nav { position: static; }
    .kid, .person, .stat { break-inside: avoid; }
  }
</style>
</head>
<body>

<!--
  ============================================================
  GIFT DATA — edit this block to update the page.
  status: "idea" | "ordered" | "arrived" | "wrapped"
  Optional fields per item: note, where, price
  ============================================================
-->
<script>
const LAST_UPDATED = "2026-10-20";
const GIFTS = {
  kids: [
    {
      name: "Ella",
      main: [
        { item: "Snow boots", status: "ordered" },
        { item: "Letterboard", status: "ordered" }
      ],
      stocking: [
        { item: "Lavender spray", status: "ordered" },
        { item: "Laneige mini lip gloss", status: "ordered" },
        { item: "Sol de Janeiro body spray", status: "ordered" },
        { item: "Laneige hydrating lip mask", status: "ordered" },
        { item: "Summer Fridays minis", status: "ordered" },
        { item: "Eyelash curler", status: "ordered" },
        { item: "Herbivore Pink Cloud Jelly Facial Cleanser (3.4 oz)", status: "ordered" },
        { item: "UGG socks", status: "ordered" }
      ]
    },
    {
      name: "Liam",
      main: [
        { item: "1000X handheld digital microscope (yellow)", status: "ordered", where: "Amazon", price: "$39.99" },
        { item: "RC fighter-jet plane with 2 batteries (black)", status: "ordered", where: "Amazon", price: "$34.99" },
        { item: "National Geographic Kids magic kit (45 tricks)", status: "ordered", where: "Amazon", price: "$31.99" }
      ],
      stocking: [
        { item: "Game Changers: Inspirational Sports Stories (book)", status: "ordered", where: "Amazon", price: "$14.95" }
      ]
    }
  ],
  // One gift each. Leave gift "" until decided.
  others: [
    { name: "Ayden",        gift: "", status: "" },
    { name: "Zayd",         gift: "", status: "" },
    { name: "Raya",         gift: "", status: "" },
    { name: "Arya",         gift: "", status: "" },
    { name: "Parees & Farid", gift: "", status: "" },
    { name: "Mom & Dad",    gift: "", status: "" },
    { name: "Lola",         gift: "", status: "" },
    { name: "Jackson",      gift: "", status: "" },
    { name: "Shirin",       gift: "", status: "" }
  ]
};
</script>

<nav>
  <a href="https://ghazal-tehrani.me/main/">&larr; Ghazal's Hub</a>
  <span class="updated" id="updated"></span>
</nav>

<div class="wrap">
  <header class="hero">
    <h1>Christmas <em>2026</em></h1>
    <p>Gifts for Ella and Liam, plus one each for the rest of the family.</p>
    <div class="stats">
      <div class="stat red"><div class="num" id="s-days">–</div><div class="lbl">Days to Christmas</div></div>
      <div class="stat green"><div class="num" id="s-have">–</div><div class="lbl">Arrived</div></div>
      <div class="stat"><div class="num" id="s-pending">–</div><div class="lbl">Ideas / ordered</div></div>
      <div class="stat red"><div class="num" id="s-todo">–</div><div class="lbl">People still to buy for</div></div>
    </div>
    <div class="legend">
      <span>Status:</span>
      <span class="pill idea">Idea</span>
      <span class="pill ordered">Ordered</span>
      <span class="pill arrived">Arrived</span>
      <span class="pill wrapped">Wrapped</span>
      <span class="pill todo">Need a gift</span>
    </div>
  </header>

  <h2 class="section">Ella &amp; Liam</h2>
  <div class="kids" id="kids"></div>

  <h2 class="section">Everyone else</h2>
  <div class="others" id="others"></div>
</div>

<footer><a href="https://ghazal-tehrani.me/main/">Ghazal's Hub</a></footer>

<script>
(function () {
  const LABEL = { idea: "Idea", ordered: "Ordered", arrived: "Arrived", wrapped: "Wrapped", todo: "Need a gift" };
  const inHand = s => s === "arrived" || s === "wrapped";
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pill = s => `<span class="pill ${s}">${LABEL[s] || s}</span>`;

  function itemRow(it) {
    const meta = [it.where, it.price, it.note].filter(Boolean).map(esc).join(" · ");
    return `<li><div><div class="item-name">${esc(it.item)}</div>${meta ? `<div class="item-meta">${meta}</div>` : ""}</div>${pill(it.status || "idea")}</li>`;
  }
  function group(title, list, emptyText) {
    const got = list.filter(i => inHand(i.status)).length;
    return `<div class="group"><h4><span>${title}</span><span>${list.length ? got + " / " + list.length + " arrived" : ""}</span></h4>${
      list.length ? `<ul class="items">${list.map(itemRow).join("")}</ul>` : `<div class="empty">${emptyText}</div>`}</div>`;
  }

  let have = 0, pending = 0, todo = 0;

  document.getElementById("kids").innerHTML = GIFTS.kids.map(k => {
    const all = k.main.concat(k.stocking);
    const got = all.filter(i => inHand(i.status)).length;
    have += got; pending += all.length - got;
    if (!k.main.length) todo++;
    const pct = all.length ? Math.round(got / all.length * 100) : 0;
    return `<article class="kid">
      <div class="kid-head"><h3>${esc(k.name)}</h3>
        <div class="count">${all.length} gift${all.length === 1 ? "" : "s"} · ${got} arrived<div class="bar"><span style="width:${pct}%"></span></div></div>
      </div>
      ${group("Main presents", k.main, "Nothing yet")}
      ${group("Stocking stuffers", k.stocking, "Nothing yet")}
    </article>`;
  }).join("");

  document.getElementById("others").innerHTML = GIFTS.others.map(p => {
    const status = p.gift ? (p.status || "idea") : "todo";
    if (status === "todo") todo++; else if (inHand(status)) have++; else pending++;
    const meta = [p.where, p.price, p.note].filter(Boolean).map(esc).join(" · ");
    return `<article class="person ${status === "todo" ? "todo" : ""}">
      <div class="person-top"><h3>${esc(p.name)}</h3>${pill(status)}</div>
      <div class="gift ${p.gift ? "" : "none"}">${p.gift ? esc(p.gift) : "No gift picked yet"}</div>
      ${meta ? `<div class="item-meta">${meta}</div>` : ""}
    </article>`;
  }).join("");

  const now = new Date();
  let xmas = new Date(now.getFullYear(), 11, 25);
  if (now > new Date(now.getFullYear(), 11, 26)) xmas = new Date(now.getFullYear() + 1, 11, 25);
  const days = Math.max(0, Math.ceil((xmas - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000));

  document.getElementById("s-days").textContent = days;
  document.getElementById("s-have").textContent = have;
  document.getElementById("s-pending").textContent = pending;
  document.getElementById("s-todo").textContent = todo;
  const d = new Date(LAST_UPDATED + "T12:00:00");
  document.getElementById("updated").textContent = "Updated " + d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
})();
</script>
</body>
</html>
